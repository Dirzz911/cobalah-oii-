<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permainan Ular Tangga</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#f3e8ff);color:#172033;min-height:100vh;padding:20px}
  .app{max-width:1050px;margin:auto}
  h1{text-align:center;margin:4px 0 6px;color:#263b80}
  .sub{text-align:center;margin:0 0 18px;color:#536078}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
  .board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#263b80;padding:7px;border-radius:14px;box-shadow:0 8px 24px #24345b30}
  .cell{aspect-ratio:1;background:#fff;position:relative;border-radius:6px;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px;font-size:clamp(9px,1.6vw,14px);font-weight:700;min-width:0}
  .cell:nth-child(4n+1){background:#fff4d6}.cell:nth-child(4n+3){background:#e8f7ff}
  .cell.start{background:#c9f7d5}.cell.finish{background:#ffe1ef}
  .num{opacity:.75}
  .markers{position:absolute;right:2px;bottom:2px;display:flex;gap:1px;flex-wrap:wrap;justify-content:flex-end;max-width:85%}
  .token{width:clamp(12px,2vw,21px);height:clamp(12px,2vw,21px);border:2px solid white;border-radius:50%;box-shadow:0 1px 4px #0005}
  .side{background:#fff;padding:18px;border-radius:16px;box-shadow:0 8px 24px #24345b20}
  .side h2{font-size:18px;margin:0 0 12px}
  .players{display:grid;gap:9px;margin-bottom:18px}
  .player{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:#f2f5fb;border:2px solid transparent}
  .player.active{border-color:#596fe8;background:#eef0ff}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 1px 3px #0004;flex:none}
  .player small{display:block;color:#68748a}
  .dice{font-size:48px;text-align:center;margin:6px 0}
  button{width:100%;border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:750;cursor:pointer;background:#5268df;color:white;box-shadow:0 4px 0 #3548ae}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 #3548ae}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{margin:14px 0;padding:12px;background:#f2f5fb;border-radius:10px;line-height:1.45;min-height:65px}
  .legend{font-size:13px;color:#58657b;line-height:1.7}
  .legend b{color:#27365b}
  .reset{margin-top:10px;background:#e9edf7;color:#27365b;box-shadow:0 4px 0 #cbd3e4}
  @media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.side{order:2}.board{gap:2px;padding:4px}.cell{padding:2px;border-radius:4px}}
</style>
</head>
<body>
<div class="app">
  <h1>🐍 Ular Tangga 🪜</h1>
  <p class="sub">Lempar dadu, naik tangga, hindari ular, dan jadilah yang pertama sampai kotak 100!</p>
  <div class="layout">
    <div id="board" class="board" aria-label="Papan ular tangga"></div>
    <aside class="side">
      <h2>🎮 Pemain</h2>
      <div id="players" class="players"></div>
      <div class="dice" id="dice">🎲</div>
      <button id="roll">LEMPAR DADU</button>
      <div class="status" id="status">Giliran Pemain 1. Tekan tombol untuk mulai!</div>
      <div class="legend">
        <b>🪜 Tangga:</b> 3→22, 8→30, 28→55, 58→77, 75→86, 80→99<br>
        <b>🐍 Ular:</b> 17→4, 32→10, 48→26, 62→18, 88→51, 97→65
      </div>
      <button class="reset" id="reset">Mulai ulang</button>
    </aside>
  </div>
</div>
<script>
const ladders={3:22,8:30,28:55,58:77,75:86,80:99};
const snakes={17:4,32:10,48:26,62:18,88:51,97:65};
const colors=['#ef476f','#118ab2','#06a77d','#f4a261'];
let positions=[0,0], current=0, busy=false, finished=false;
const board=document.getElementById('board');
const playersEl=document.getElementById('players');
const statusEl=document.getElementById('status');
const diceEl=document.getElementById('dice');
const rollBtn=document.getElementById('roll');
function cellOrder(){
  const a=[];
  for(let row=9;row>=0;row--){
    const nums=Array.from({length:10},(_,i)=>row*10+i+1);
    if((9-row)%2===1) nums.reverse();
    a.push(...nums);
  }
  return a;
}
const order=cellOrder();
function drawBoard(){
  board.innerHTML='';
  order.forEach(n=>{
    const c=document.createElement('div');
    c.className='cell'+(n===1?' start':'')+(n===100?' finish':'');
    c.dataset.n=n;
    let mark='';
    if(ladders[n]) mark='🪜';
    if(snakes[n]) mark='🐍';
    c.innerHTML=`<span class="num">${n}</span><span style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(12px,2vw,20px)">${mark}</span><span class="markers"></span>`;
    board.appendChild(c);
  });
  renderTokens();
}
function renderPlayers(){
  playersEl.innerHTML=positions.map((p,i)=>`
    <div class="player ${i===current&&!finished?'active':''}">
      <span class="dot" style="background:${colors[i]}"></span>
      <div><strong>Pemain ${i+1}</strong><small>Posisi: ${p===0?'Mulai':p}</small></div>
    </div>`).join('');
}
function renderTokens(){
  document.querySelectorAll('.markers').forEach(x=>x.innerHTML='');
  positions.forEach((p,i)=>{
    if(p>0){
      const target=document.querySelector(`.cell[data-n="${p}"] .markers`);
      const token=document.createElement('span');
      token.className='token';token.style.background=colors[i];token.title=`Pemain ${i+1}`;
      target.appendChild(token);
    }
  });
  renderPlayers();
}
function nextTurn(){
  current=(current+1)%positions.length;
  renderPlayers();
}
rollBtn.addEventListener('click',()=>{
  if(busy||finished)return;
  busy=true;rollBtn.disabled=true;
  const roll=Math.floor(Math.random()*6)+1;
  diceEl.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][roll-1];
  let old=positions[current], next=old+roll;
  if(next>100){
    statusEl.textContent=`Pemain ${current+1} mendapat ${roll}, tetapi harus mendapat angka yang pas untuk mencapai 100.`;
    setTimeout(()=>{nextTurn();busy=false;rollBtn.disabled=false;},900);
    return;
  }
  positions[current]=next;
  let message=`Pemain ${current+1} melempar ${roll} dan maju ke kotak ${next}.`;
  if(ladders[next]){positions[current]=ladders[next];message+=` 🪜 Naik tangga ke ${positions[current]}!`;}
  else if(snakes[next]){positions[current]=snakes[next];message+=` 🐍 Digigit ular! Turun ke ${positions[current]}.`;}
  renderTokens();
  if(positions[current]===100){
    statusEl.textContent=`🏆 Selamat! Pemain ${current+1} menang!`;
    finished=true;rollBtn.disabled=true;busy=false;return;
  }
  statusEl.textContent=message;
  setTimeout(()=>{nextTurn();busy=false;rollBtn.disabled=false;},1100);
});
document.getElementById('reset').addEventListener('click',()=>{
  positions=[0,0];current=0;busy=false;finished=false;
  diceEl.textContent='🎲';statusEl.textContent='Permainan baru dimulai. Giliran Pemain 1!';
  rollBtn.disabled=false;drawBoard();
});
drawBoard();
</script>
</body>
</html>
